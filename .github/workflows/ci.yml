name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit (high+)
        run: npm run audit:ci

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build lib
        run: npm run build:lib

      - name: Build plugin packages
        run: npm run build:plugins

      - name: Unit tests
        run: npm run test:run

      - name: CLI tests (node:test)
        run: npm run test:cli

      - name: Create scaffold smoke
        run: npm run test:create-smoke

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests (includes build:lib)
        run: npm run test:integration

  coverage:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/index.html

  coverage-pr:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests with coverage (informational on PR)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr
          path: |
            coverage/lcov.info
            coverage/index.html

  verify-maestro-app-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Maestro appId matches demo
        run: npm run verify:maestro-app-id

  build:
    needs: [lint, unit, integration, security-audit, verify-maestro-app-id]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: App build
        run: npm run build

      - name: Demo build
        run: npm run demo:build

      - name: Demo bundle budget
        run: npm run verify:bundle-budget

      - name: Capacitor doctor (informational)
        continue-on-error: true
        run: npx appspresso doctor || true

  native-android:
    name: Native Android (assembleDebug)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prepare native Android (demo build + cap sync in demo/)
        run: node scripts/ci-prepare-native.mjs android

      - name: Assemble and verify debug APK
        run: node scripts/assemble-android-debug.mjs

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: demo/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  native-ios:
    name: Native iOS (simulator build)
    needs: [build]
    runs-on: macos-14
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure demo Capacitor deps
        run: node scripts/ensure-demo-capacitor-deps.mjs

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Ensure iOS platform (demo/)
        run: node scripts/ensure-ios-platform.mjs

      - name: Prepare native iOS (demo build + cap sync in demo/)
        run: node scripts/ci-prepare-native.mjs ios

      - name: Build for iOS Simulator
        run: npx appspresso native assemble ios

      - name: Package iOS simulator app (zip)
        id: ios_app
        run: |
          ZIP_PATH=$(node scripts/ios-simulator-artifact.mjs package)
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ steps.ios_app.outputs.zip }}
          if-no-files-found: error

  native-e2e-android:
    name: Native E2E Android (Maestro)
    needs: [native-android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Enable KVM (hardware-accelerated emulator on Linux)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/android-apk

      - name: Maestro smoke on emulator
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner invokes this with /bin/sh (dash), not bash.
          script: |
            set -eu
            node scripts/e2e/android-install.mjs artifacts/android-apk
            node scripts/e2e/maestro.mjs --platform android

      - name: Upload Maestro screenshots
        if: always()
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-android
          path: |
            ~/.maestro/tests
            e2e/maestro/shared
          if-no-files-found: ignore

  native-e2e-ios:
    name: Native E2E iOS (Maestro)
    needs: [native-ios]
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download iOS simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: artifacts/ios-app

      - name: Boot simulator and install app
        id: ios_install
        run: |
          set -eu
          DEVICE_ID=$(node scripts/e2e/ios-install.mjs artifacts/ios-app)
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Maestro smoke
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: node scripts/e2e/maestro.mjs --platform ios --device "${{ steps.ios_install.outputs.device_id }}"

      - name: Upload Maestro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-ios
          path: |
            ~/.maestro/tests
            e2e/maestro/shared
          if-no-files-found: ignore
