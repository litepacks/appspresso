name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:run

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests (includes build:lib)
        run: npm run test:integration

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/index.html

  build:
    needs: [lint, unit, integration, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: App build
        run: npm run build

      - name: Demo build
        run: npm run demo:build

      - name: Capacitor doctor (informational)
        continue-on-error: true
        run: npx appspresso doctor || true

  native-android:
    name: Native Android (assembleDebug)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Cap sync and assemble debug APK
        run: npm run ci:native:android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: demo/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  native-ios:
    name: Native iOS (simulator build)
    needs: [build]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Cap sync and build for iOS Simulator
        run: npm run ci:native:ios
