name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: CLI tests (node:test)
        run: npm run test:cli

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests (includes build:lib)
        run: npm run test:integration

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/index.html

  build:
    needs: [lint, unit, integration, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: App build
        run: npm run build

      - name: Demo build
        run: npm run demo:build

      - name: Upload web assets for native jobs
        uses: actions/upload-artifact@v4
        with:
          name: native-web-assets
          path: |
            demo/dist
            dist-lib
          retention-days: 3

      - name: Capacitor doctor (informational)
        continue-on-error: true
        run: npx appspresso doctor || true

  native-android:
    name: Native Android (assembleDebug)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Download web assets from build job
        uses: actions/download-artifact@v4
        with:
          name: native-web-assets
          path: .

      - name: Verify downloaded demo bundle (informational)
        continue-on-error: true
        run: node scripts/verify-native-web-bundle.mjs

      - name: Cap sync and assemble debug APK
        run: npm run ci:native:android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: demo/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  native-ios:
    name: Native iOS (simulator build)
    needs: [build]
    runs-on: macos-14
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Download web assets from build job
        uses: actions/download-artifact@v4
        with:
          name: native-web-assets
          path: .

      - name: Verify downloaded demo bundle (informational)
        continue-on-error: true
        run: node scripts/verify-native-web-bundle.mjs

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Cap sync and build for iOS Simulator
        run: npm run ci:native:ios

      - name: Package iOS simulator app (zip)
        id: ios_app
        run: |
          ZIP_PATH=$(node scripts/ios-simulator-artifact.mjs package)
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ steps.ios_app.outputs.zip }}
          if-no-files-found: error

  native-e2e-android:
    name: Native E2E Android (Maestro)
    needs: [native-android]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Enable KVM (hardware-accelerated emulator on Linux)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/android-apk

      - name: Maestro smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner invokes this with /bin/sh (dash), not bash — no pipefail or [[ ]].
          script: |
            set -eu
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed 2>/dev/null)" ]; do sleep 2; done'
            adb shell 'while [ "$(getprop init.svc.bootanim 2>/dev/null)" != "stopped" ]; do sleep 2; done'
            adb shell wm dismiss-keyguard || true
            adb install -r artifacts/android-apk/*.apk
            maestro test e2e/maestro

      - name: Upload Maestro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-android
          path: |
            ~/.maestro/tests
            e2e/maestro
          if-no-files-found: ignore

  native-e2e-ios:
    name: Native E2E iOS (Maestro)
    needs: [native-ios]
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download iOS simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: artifacts/ios-app

      - name: Boot simulator and install app
        run: |
          set -eu
          SIM_ID=$(xcrun simctl list devices available -j | node -e "
            const j = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const runtimes = Object.keys(j.devices).filter((k) => k.includes('iOS'));
            const devices = runtimes.flatMap((k) => j.devices[k] || []);
            const iphones = devices.filter((d) => d.isAvailable && /^iPhone /.test(d.name));
            const preferred = ['iPhone 16', 'iPhone 15 Pro', 'iPhone 15'];
            const pick =
              iphones.find((d) => preferred.includes(d.name)) ||
              iphones.sort((a, b) => b.name.localeCompare(a.name))[0];
            if (!pick) process.exit(1);
            process.stdout.write(pick.udid);
          ")
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          APP_PATH=$(node scripts/ios-simulator-artifact.mjs resolve artifacts/ios-app)
          xcrun simctl install "$SIM_ID" "$APP_PATH"

      - name: Maestro smoke
        run: maestro test e2e/maestro

      - name: Upload Maestro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-ios
          path: |
            ~/.maestro/tests
            e2e/maestro
          if-no-files-found: ignore
